name: Bug report
description: Report a reproducible problem in Doom Term.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Search existing Doom Term issues first. Report vulnerabilities through the private security link, not this form. Redact secrets and private session details."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands or a minimal example and whether this is a regression.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doom Term version or commit
      description: Use the release tag or source commit you built.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS version, architecture, and shell
      placeholder: Ubuntu 24.04, x86_64, Bash 5.2
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or logs
      description: Include relevant evidence with credentials and private details removed.
