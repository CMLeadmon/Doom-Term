name: SSH or remote agent status
description: Report SSH session, group directory, or remote agent-status problems.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use the remote-agent-status and tab-group guides in docs/doom-term. Do not publish passwords, keys, private hostnames, or personal session records."
  - type: textarea
    id: problem
    attributes:
      label: Observed and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and setup
      description: Describe direct SSH, tmux, group default, or status helper setup using redacted examples.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Doom Term version, local OS/shell, and remote OS/shell
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Agent and helper versions, if relevant
      description: State which helper and agent are installed and whether you restarted after configuration.
  - type: textarea
    id: evidence
    attributes:
      label: Redacted terminal output, screenshots, or logs
