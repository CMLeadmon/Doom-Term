name: Shell startup or integration
description: Report a shell that fails to start or bootstrap correctly.
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Doom Term version, OS, architecture, and shell version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Describe shell configuration and the smallest setup that reproduces the failure.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted output and screenshots
      description: Remove credentials, private paths, and personal session data before posting.
