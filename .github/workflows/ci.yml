name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run Node test runner & Vitest suite
        run: npm test

      - name: Typecheck and build frontend
        run: npm run build

      - name: Run PTY crate tests
        run: cargo test --manifest-path crates/doom-term-pty/Cargo.toml

      - name: Check backend Rust compilation
        run: cargo check --manifest-path backend/Cargo.toml

      # Doom Term is a desktop app first, so the shell that ships it has to
      # build. It was never checked here, and had drifted far enough that its
      # declared icons did not exist.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev

      - name: Build the sidecar the desktop shell bundles
        run: npm run sidecar

      - name: Check Tauri shell compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml
