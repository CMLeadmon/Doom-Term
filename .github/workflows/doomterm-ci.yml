name: Doom Term CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  policy-and-plate-tests:
    name: Policy & Plate Pure-Rust Invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.92.0
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Verify Build Policy (No Hosted Crates)
        run: |
          python3 ./script/doomterm/check-build-policy.py

      - name: Verify Invasive Diff Inventory Ledger
        run: |
          python3 ./script/doomterm/check-inventory.py

      - name: Run Doom Term Logic and Plate Tests
        run: |
          cargo test -p doomterm_agents -p doomterm_plate -p doomterm_backdrop --verbose

      - name: Test remote agent helper
        run: |
          python3 -m unittest discover -s script/doomterm -p 'test_*agent_status.py'

      - name: Test icon generator, runtime feature allowlist and plate trace analysis
        run: |
          python3 -m unittest discover -s script/doomterm -p 'test_generate_icons.py'
          python3 -m unittest discover -s script/doomterm -p 'test_runtime_flags.py'
          python3 -m unittest discover -s script/doomterm -p 'test_analyze_plate_trace.py'
          python3 -m unittest discover -s script/doomterm -p 'test_package_theme.py'

      - name: Test channel manifest rendering and check the rendered cask
        run: |
          python3 -m unittest discover -s script/doomterm -p 'test_channel_manifests.py'
          python3 script/doomterm/channel_manifests.py render --tag v1.1.8 --sums script/doomterm/fixtures/SHA256SUMS.v1.1.8.txt --out "$RUNNER_TEMP/channels"
          ruby -c "$RUNNER_TEMP/channels/homebrew-doomterm/Casks/doomterm.rb"

      - name: Test tab group directory commands and SQLite migration
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          ./script/doomterm/test-tab-groups
          python3 -m unittest discover -s script/doomterm -p 'test_group_persistence.py'
          ./script/doomterm/test-tab-groups --clippy

      - name: Check Blue Highway and Canopy GIFs match their generators
        run: |
          node script/doomterm/themegen/bake.js --check

      - name: Test the footage capture tools and check the committed footage loops
        run: |
          node --test script/doomterm/doomcap/doomcap.test.js
          node script/doomterm/doomcap/check.js

      - name: Run Doom Term Logic and Plate Clippy Audit
        run: |
          cargo clippy -p doomterm_agents -p doomterm_plate -p doomterm_backdrop --all-targets -- -D warnings

  build-linux:
    name: Build Linux x86_64
    needs: policy-and-plate-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libasound2-dev libssl-dev libfuse2

      - name: Verify In-Band Terminal Parsing
        run: |
          cargo test -p warp_terminal parse_osc777_agent_status_preserves_json_for_pane_listener

      - name: Build Doom Term Linux Binary
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export GIT_RELEASE_TAG="${GITHUB_REF_NAME#v}"
          fi
          cargo build -p warp --profile release-lto --bin doomterm --no-default-features --features release_bundle,doomterm,gui

      - name: Verify Packaged Binary Carries Single-Instance Support
        run: |
          grep -a -q -F "no existing instance found to forward args to" target/release-lto/doomterm

      - name: Package Linux Standalone Tarball
        run: |
          mkdir -p staging/doomterm-linux-x86_64
          cp target/release-lto/doomterm staging/doomterm-linux-x86_64/
          cp app/channels/doomterm/io.cmleadmon.DoomTerm.desktop staging/doomterm-linux-x86_64/
          cp app/channels/doomterm/icon/no-padding/512x512.png staging/doomterm-linux-x86_64/doomterm.png
          cp app/channels/doomterm/icon/no-padding/icon.ico staging/doomterm-linux-x86_64/
          cp README.md staging/doomterm-linux-x86_64/
          cp RELEASE_NOTES.md staging/doomterm-linux-x86_64/
          tar -czf doomterm-linux-x86_64.tar.gz -C staging doomterm-linux-x86_64

      - name: Install Pinned AppImage Tooling
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl -fsSL --retry 3 --retry-all-errors -o "$tools/linuxdeploy-x86_64.AppImage" https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $tools/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          curl -fsSL --retry 3 --retry-all-errors -o "$tools/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/linuxdeploy-x86_64.AppImage"
          ln -sf linuxdeploy-x86_64.AppImage "$tools/linuxdeploy"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Build Linux AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LDAI_OUTPUT: DoomTerm-x86_64.AppImage
          LDAI_NO_APPSTREAM: '1'
          LDAI_RUNTIME_FILE: ${{ runner.temp }}/appimage-tools/runtime-x86_64
          SETTINGS_SCHEMA_EXECUTABLE: ${{ github.workspace }}/target/release-lto/doomterm
        run: |
          set -euo pipefail
          LDAI_UPDATE_INFORMATION="$(python3 script/doomterm/channel_manifests.py appimage-update-info)"
          export LDAI_UPDATE_INFORMATION
          ./script/linux/bundle --channel doomterm --skip-build --packages appimage
          cp target/release-lto/bundle/linux/DoomTerm-x86_64.AppImage target/release-lto/bundle/linux/DoomTerm-x86_64.AppImage.zsync .

      - name: Verify AppImage Runs And Carries Its Update Address
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          expected="$(python3 script/doomterm/channel_manifests.py appimage-update-info)"
          embedded="$(readelf -p .upd_info DoomTerm-x86_64.AppImage | sed -n 's/^ *\[ *[0-9a-f]*\] *//p')"
          test "$embedded" = "$expected"
          header="$(head -n 8 DoomTerm-x86_64.AppImage.zsync)"
          grep -Fxq 'Filename: DoomTerm-x86_64.AppImage' <<<"$header"
          grep -Fxq 'URL: DoomTerm-x86_64.AppImage' <<<"$header"
          test "$(sed -n 's/^Length: //p' <<<"$header")" = "$(stat -c %s DoomTerm-x86_64.AppImage)"
          test "$(sed -n 's/^SHA-1: //p' <<<"$header")" = "$(sha1sum DoomTerm-x86_64.AppImage | cut -d' ' -f1)"
          ./DoomTerm-x86_64.AppImage --version
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "$(./DoomTerm-x86_64.AppImage --version)" = "Doom Term ${GITHUB_REF_NAME#v}"
          fi

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doomterm-linux-x86_64
          path: |
            doomterm-linux-x86_64.tar.gz
            DoomTerm-x86_64.AppImage
            DoomTerm-x86_64.AppImage.zsync

  build-macos:
    name: Build macOS ARM64
    needs: policy-and-plate-tests
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.92.0
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install macOS Dependencies
        run: |
          brew install protobuf create-dmg

      - name: Install cargo-bundle
        run: |
          ./script/install_cargo_bundle

      - name: Build and Bundle macOS App
        run: |
          ./script/macos/bundle -c doomterm --nouniversal --arch aarch64 --nosign --release-tag ${{ github.ref_name }}

      - name: Package macOS App Bundle
        run: |
          cd target/aarch64-apple-darwin/release-lto/bundle
          zip -r -y ../../../../doomterm-macos-arm64.zip osx/DoomTerm.app
          if [ -f dmg/DoomTerm.dmg ]; then
            cp dmg/DoomTerm.dmg ../../../../doomterm-macos-arm64.dmg
          elif [ -f dmg/doomterm/DoomTerm.dmg ]; then
            cp dmg/doomterm/DoomTerm.dmg ../../../../doomterm-macos-arm64.dmg
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doomterm-macos-arm64
          path: |
            doomterm-macos-arm64.zip
            doomterm-macos-arm64.dmg

  build-windows:
    name: Build Windows x86_64
    needs: policy-and-plate-tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Windows Protoc and Inno Setup
        shell: pwsh
        run: |
          choco install protoc innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and Bundle Windows Installer
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $env:GIT_RELEASE_TAG = $tag
          .\script\windows\bundle.ps1 -channel doomterm

      - name: Package Windows Standalone Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging\doomterm-windows-x64 -Force
          Copy-Item target\x86_64-pc-windows-msvc\rlto\doomterm.exe staging\doomterm-windows-x64\
          Copy-Item app\assets\windows\x64\* staging\doomterm-windows-x64\
          Copy-Item README.md staging\doomterm-windows-x64\
          Copy-Item RELEASE_NOTES.md staging\doomterm-windows-x64\
          Compress-Archive -Path staging\doomterm-windows-x64\* -DestinationPath doomterm-windows-x64.zip -Force

      - name: Upload Windows Installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doomterm-windows-installer
          path: script/windows/Output/DoomTermSetup.exe

      - name: Upload Windows Standalone Zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doomterm-windows-standalone
          path: doomterm-windows-x64.zip

  publish-release:
    permissions:
      contents: write
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Linux Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: doomterm-linux-x86_64
          path: release-assets/

      - name: Download macOS Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: doomterm-macos-arm64
          path: release-assets/

      - name: Download Windows Installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: doomterm-windows-installer
          path: release-assets/

      - name: Download Windows Standalone Zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: doomterm-windows-standalone
          path: release-assets/

      - name: Compute Release Checksums
        run: |
          for pack in redsky bluehighway canopy replay bfr; do
            python3 script/doomterm/package_theme.py "$pack" --out "release-assets/doomterm-${pack}-theme.zip"
          done
          cp script/doomterm/remote_agent_status.py release-assets/doomterm-agent-status.py
          cp script/doomterm/in_band_agent_status.py release-assets/doomterm-agent-status-in-band.py
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
