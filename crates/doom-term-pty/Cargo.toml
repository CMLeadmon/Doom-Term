[package]
name = "doom-term-pty"
version = "0.1.0"
edition = "2021"

[dependencies]
portable-pty = "0.8"
vte = "0.14"
serde = { version = "1.0", features = ["derive"] }
parking_lot = "0.12"
anyhow = "1.0"
log = "0.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "term"] }
