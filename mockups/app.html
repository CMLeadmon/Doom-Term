<!doctype html>
<html><head><meta charset="utf-8">
<title>Warp Sidecar — 1:1 render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="device.css">
<style>html,body{margin:0;background:#000} #root{width:2100px}</style>
</head><body>
<div id="root"></div>
<script type="module">
import { deviceHTML, PLATE_STATE } from './device.js';
import { mount } from './paint.js';
const bare = new URLSearchParams(location.search).has('bare');
const root = document.getElementById('root');
root.innerHTML = deviceHTML();
if (bare) {
  // The parity render is the Warp rebuild ALONE: the rail and the plate are
  // additions, and measuring them against a screenshot that never had them
  // would report a deficit that is really a feature.
  root.querySelector('.rail')?.remove();
  root.querySelector('.dock')?.remove();
  root.querySelector('.device').style.height = '1313px';
}
await document.fonts.ready;
if (!bare) mount(root, PLATE_STATE, { still: true });
document.documentElement.dataset.ready = '1';
</script>
</body></html>
