[package]
name = "doom-term"
version = "0.1.0"
description = "Doom Term: Agentic Coding Terminal Manager"
authors = ["cleadmon"]
edition = "2021"

[lib]
name = "doom_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
doom-term-pty = { path = "../crates/doom-term-pty" }
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
vte = "0.14"
tokio = { version = "1.40", features = ["full"] }
parking_lot = "0.12"
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.12"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "term"] }
