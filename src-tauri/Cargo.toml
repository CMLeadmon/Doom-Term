[package]
name = "doom-term"
version = "0.1.0"
description = "Doom Term: Agentic Coding Terminal Manager"
authors = ["cleadmon"]
edition = "2021"

[lib]
name = "doom_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
# Only for expand_path — the PTY itself runs in the bundled daemon.
doom-term-pty = { path = "../crates/doom-term-pty" }
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
